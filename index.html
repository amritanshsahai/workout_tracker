<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Tracker</title>
<meta name="theme-color" content="#14151A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- HOME VIEW -->
  <section class="view" id="view-home">
    <header class="topbar">
      <h1 id="home-routine-name">Routine</h1>
    </header>
    <div class="scroll-area">
      <div id="home-exercise-list" class="exercise-list"></div>

      <div class="home-actions">
        <button id="btn-undo" class="btn btn-secondary" hidden>Undo last completion</button>
        <button id="btn-complete" class="btn btn-primary">Mark routine complete</button>
      </div>
    </div>
  </section>

  <!-- MANAGE VIEW -->
  <section class="view" id="view-manage" hidden>
    <header class="topbar">
      <button id="btn-manage-back" class="icon-btn" hidden aria-label="Back">‹</button>
      <h1 id="manage-title">Routines</h1>
    </header>
    <div class="scroll-area">
      <div id="manage-routines-list" class="routine-list"></div>
      <button id="btn-add-routine" class="btn btn-outline btn-block">Add routine</button>

      <div id="manage-exercises-list" class="exercise-manage-list" hidden></div>
      <button id="btn-add-exercise" class="btn btn-outline btn-block" hidden>Add exercise</button>
    </div>
  </section>

  <!-- CALENDAR VIEW -->
  <section class="view" id="view-calendar" hidden>
    <header class="topbar">
      <button id="btn-cal-prev" class="icon-btn" aria-label="Previous month">‹</button>
      <h1 id="calendar-month-label">Month</h1>
      <button id="btn-cal-next" class="icon-btn" aria-label="Next month">›</button>
    </header>
    <div class="scroll-area">
      <div id="calendar-grid" class="calendar-grid"></div>
      <div id="calendar-legend" class="calendar-legend"></div>
      <button id="btn-cal-edit" class="btn btn-outline btn-block">Edit past entries</button>
      <button id="btn-cal-done" class="btn btn-primary btn-block" hidden>Done editing</button>
    </div>
  </section>

  <!-- BODY VIEW -->
  <section class="view" id="view-body" hidden>
    <header class="topbar">
      <h1>Body</h1>
    </header>
    <div class="scroll-area">

      <div class="body-section">
        <div class="settings-row">
          <span>Weight unit</span>
          <div class="unit-toggle" id="unit-toggle">
            <button data-unit="lbs" class="unit-btn">lbs</button>
            <button data-unit="kg" class="unit-btn">kg</button>
          </div>
        </div>
        <div class="settings-row">
          <span>Height unit</span>
          <div class="unit-toggle" id="height-unit-toggle">
            <button data-unit="ft_in" class="unit-btn">ft/in</button>
            <button data-unit="cm" class="unit-btn">cm</button>
          </div>
        </div>
      </div>

      <div class="body-section">
        <div class="section-header-row">
          <h2 class="section-title">Profile</h2>
          <button class="text-btn" id="btn-edit-profile">Edit</button>
        </div>
        <p id="profile-summary" class="profile-summary">Not set up yet.</p>
      </div>

      <div class="body-section">
        <h2 class="section-title">Log weight</h2>
        <div class="log-weight-row">
          <input type="number" inputmode="decimal" step="0.1" id="quick-weight-input" class="field-input" placeholder="Today's weight">
          <button class="btn btn-primary" id="btn-log-weight">Log</button>
        </div>
        <button class="text-btn" id="btn-add-past-entry">+ Add a past entry</button>
      </div>

      <div class="body-section" id="stats-card-section" hidden>
        <h2 class="section-title">Current stats</h2>
        <div class="stats-card" id="stats-card"></div>
      </div>

      <div class="body-section" id="trend-section" hidden>
        <h2 class="section-title">Weight trend</h2>
        <div id="trend-chart"></div>
      </div>

      <div class="body-section" id="history-section" hidden>
        <h2 class="section-title">History</h2>
        <div id="history-list" class="history-list"></div>
      </div>

      <p class="settings-note">App version 1.0 — all data stays on this device.</p>
    </div>
  </section>

  <!-- BOTTOM TAB BAR -->
  <nav class="tabbar" id="tabbar">
    <button class="tab-btn active" data-view="home">
      <span class="tab-icon">●</span><span>Home</span>
    </button>
    <button class="tab-btn" data-view="manage">
      <span class="tab-icon">▤</span><span>Manage</span>
    </button>
    <button class="tab-btn" data-view="calendar">
      <span class="tab-icon">▦</span><span>Calendar</span>
    </button>
    <button class="tab-btn" data-view="body">
      <span class="tab-icon">⚕</span><span>Body</span>
    </button>
  </nav>
</div>

<!-- MODAL ROOT (picker, exercise editor, confirmations) -->
<div id="modal-root"></div>

<script src="app.js"></script>
</body>
</html>
